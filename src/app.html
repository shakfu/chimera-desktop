<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<link rel="icon" href="favicon.ico" sizes="48x48" />
		<link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<!--
			chimera-desktop: WebKit loads `tauri://localhost` with no path. For that
			non-special scheme `new URL(location.href).pathname` is "" while
			`location.pathname` is "/", so SvelteKit's hash router treats the start
			URL as external and reloads it forever. Add the slash before it starts.
		-->
		<script>
			if (new URL(location.href).pathname === '') {
				history.replaceState(history.state, '', location.origin + '/' + location.search + location.hash);
			}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
